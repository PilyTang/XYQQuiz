<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>梦幻西游科举助手</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="preview-panel" aria-label="游戏预览">
        <div class="canvas-stack">
          <canvas id="frameCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
          <p id="previewHint">等待游戏画面…</p>
        </div>
      </section>
      <aside class="sidebar">
        <header><p class="eyebrow">本机识别状态</p><h1>科举答题助手</h1></header>
        <dl class="status-grid">
          <div><dt>阶段</dt><dd id="phase">—</dd></div>
          <div><dt>采集</dt><dd id="capturePhase">—</dd></div>
          <div class="wide"><dt>OCR 题目</dt><dd id="question">等待识别</dd></div>
          <div class="wide"><dt>官方答案</dt><dd id="answer">—</dd></div>
          <div><dt>题目分数</dt><dd id="questionScore">—</dd></div>
          <div><dt>选项分数</dt><dd id="optionScore">—</dd></div>
          <div><dt>定位状态</dt><dd id="confidenceLevel" data-level="NONE">未定位</dd></div>
          <div><dt>综合可信评分</dt><dd id="confidenceScore">0/100</dd></div>
          <div class="wide"><dt>可信说明</dt><dd id="confidenceReason">—</dd></div>
          <div class="wide"><dt>耗时</dt><dd id="timings">—</dd></div>
        </dl>
        <div class="actions">
          <button id="updateButton" type="button" disabled>更新题库</button>
          <button id="diagnosticsButton" type="button" class="secondary" disabled>保存识别诊断</button>
          <button id="environmentDiagnosticsButton" type="button" class="secondary" disabled>导出环境诊断</button>
          <button id="shutdownButton" type="button" class="secondary" disabled>退出程序</button>
        </div>
        <details class="local-bank-panel">
          <summary>本地补题 <span id="localQuestionCount">0 条</span></summary>
          <p class="panel-help">仅保存在本机 user-data，不会随诊断文件或发布包导出。</p>
          <p id="localQuestionError" class="panel-error" role="alert"></p>
          <form id="localQuestionForm">
            <input id="localQuestionId" type="hidden">
            <label>
              模式
              <select id="localQuestionMode">
                <option value="supplement">补充题目</option>
                <option value="override">覆盖官方答案</option>
              </select>
            </label>
            <label id="localQuestionTargetField" hidden>
              官方 source_id（可留空按题目自动匹配）
              <input id="localQuestionTarget" type="text" autocomplete="off">
            </label>
            <label>
              题目
              <textarea id="localQuestionText" rows="3" required></textarea>
            </label>
            <label>
              答案
              <input id="localQuestionAnswer" type="text" required autocomplete="off">
            </label>
            <label>
              答案别名（每行一个）
              <textarea id="localQuestionAliases" rows="2"></textarea>
            </label>
            <label class="checkbox-label">
              <input id="localQuestionEnabled" type="checkbox" checked>
              启用此题
            </label>
            <div class="local-form-actions">
              <button id="localQuestionSave" type="submit" disabled>保存本地题目</button>
              <button id="localQuestionCancel" type="button" class="secondary" hidden>取消编辑</button>
            </div>
          </form>
          <div id="localQuestionList" class="local-question-list" aria-live="polite"></div>
        </details>
        <p id="errorMessage" role="alert"></p>
      </aside>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
